name: Oracle VM Auto Retry

on:
  workflow_dispatch: # Manuel tetikleme için
  repository_dispatch: # Dış servislerden tetikleme için
    types: [trigger-retry]
  schedule:
    - cron: '*/5 * * * *' # 5 dakikada bir sunucu denemesi
    - cron: '0 19 * * *'  # Her gün TSI 22:00'da (UTC 19:00) günlük rapor

jobs:
  launch:
    # Rapor saati değilse veya manuel/API tetiklemesiyse çalışır
    if: github.event.schedule != '0 19 * * *'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ad:
          - "LHiX:EU-FRANKFURT-1-AD-1"
          - "LHiX:EU-FRANKFURT-1-AD-2"
          - "LHiX:EU-FRANKFURT-1-AD-3"
    steps:
      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Setup OCI Config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=eu-frankfurt-1
          EOF
          chmod 600 ~/.oci/config

      - name: Launch VM
        id: launch_vm
        continue-on-error: true
        shell: bash
        env:
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          oci compute instance launch \
            --availability-domain "${{ matrix.ad }}" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --display-name minecraft-server \
            --assign-public-ip true \
            --ssh-authorized-keys-file <(echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}")

      - name: Send Success Telegram Notification
        if: steps.launch_vm.outcome == 'success'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🎉 *Oracle Sunucusu Başarıyla Kuruldu!*%0A%0AFrankfurt bölgesinde 4 OCPU / 24GB RAM sunucun açıldı. Otomasyonu kapatmayı unutma!" \
            -d "parse_mode=Markdown"

  daily-report:
    # Yalnızca her gün TSI 22:00'da (UTC 19:00) çalışır
    if: github.event.schedule == '0 19 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Health Check Report
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=📊 *Günlük Otomasyon Raporu*%0A%0AOracle sunucu arama botun aktif olarak çalışıyor.%0A🔹 Toplam Çalışma/Deneme Sayısı: #${{ github.run_number }}%0A%0AHenüz uygun kapasite yakalanamadı, denemelere devam ediliyor. 🤖" \
            -d "parse_mode=Markdown"
