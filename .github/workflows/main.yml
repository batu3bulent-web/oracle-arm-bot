name: Launch Micro AMD Instance

on:
  workflow_dispatch: # Manuel çalıştırmak için (Run workflow)

jobs:
  launch-micro:
    runs-on: ubuntu-latest
    steps:
      - name: Setup OCI CLI
        uses: oracle-actions/setup-oci-cli@v1
        with:
          user_ocid: ${{ secrets.OCI_USER_OCID }}
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private_key: ${{ secrets.OCI_KEY_FILE }}
          region: ${{ secrets.OCI_REGION }}

      - name: Launch AMD Micro Instance
        id: launch_micro
        run: |
          # Canonical Ubuntu 22.04 Minimal Minimal AMD Image OCID (Frankfurt)
          # NOT: Eğer imaj hatası verirse paneldeki varsayılan Ubuntu AMD imaj OCID'sini Secrets'a veya buraya koyabilirsin.
          IMAGE_ID="ocid1.image.oc1.eu-frankfurt-1.aaaaaaaa63x3s6vg3ooyqf5752sptp4gqnzpft3gzyxwqxyt52r5m3e3p32a"

          echo "Micro VM kuruluyor..."
          
          # SSH anahtarını geçici dosyaya kaydet
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > ssh_key.pub

          RESPONSE=$(oci compute instance launch \
            --availability-domain "LHiX:EU-FRANKFURT-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.E2.1.Micro" \
            --subnet-id "${{ secrets.OCI_SUBNET_OCID }}" \
            --image-id "$IMAGE_ID" \
            --display-name "micro-runner-vm" \
            --assign-public-ip true \
            --ssh-authorized-keys-file ssh_key.pub)

          # Oluşturulan sunucunun ID'sini al
          INSTANCE_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Send Success Telegram Notification
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ *AMD Micro VM Başarıyla Açıldı!*%0A%0A🚀 Şimdi SSH ile bağlanıp seri arama scriptini başlatabiliriz." \
            -d "parse_mode=Markdown"
