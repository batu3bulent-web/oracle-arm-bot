name: Oracle VM Auto Retry

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  create-vm:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ad:
          - "LHiX:EU-FRANKFURT-1-AD-1"
          - "LHiX:EU-FRANKFURT-1-AD-2"
          - "LHiX:EU-FRANKFURT-1-AD-3"

    steps:
      - name: Install OCI CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install oci-cli

      - name: Configure OCI
        shell: bash
        run: |
          mkdir -p ~/.oci

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF

          printf "%s" "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/config
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Show Configuration
        run: |
          echo "Region:"
          oci iam region list | head

          echo "Using AD:"
          echo "${{ matrix.ad }}"

      - name: Launch VM
        continue-on-error: true
        shell: bash
        run: |
          oci compute instance launch \
            --availability-domain "${{ matrix.ad }}" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --display-name minecraft-server \
            --assign-public-ip true \
            --ssh-authorized-keys-file <(echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}")

      - name: Finished
        run: echo "Döngü adımı tamamlandı."
