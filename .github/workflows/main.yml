name: Launch Micro AMD Instance

on:
  workflow_dispatch:

jobs:
  launch-micro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & Install OCI CLI
        run: |
          python3 -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

      - name: Launch AMD Micro Instance
        id: launch_micro
        run: |
          # Canonical Ubuntu 22.04 Minimal AMD Image OCID (Frankfurt)
          IMAGE_ID="ocid1.image.oc1.eu-frankfurt-1.aaaaaaaa63x3s6vg3ooyqf5752sptp4gqnzpft3gzyxwqxyt52r5m3e3p32a"

          echo "Micro VM kuruluyor..."
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > ssh_key.pub

          RESPONSE=$(oci compute instance launch \
            --availability-domain "LHiX:EU-FRANKFURT-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.E2.1.Micro" \
            --subnet-id "${{ secrets.OCI_SUBNET_OCID }}" \
            --image-id "$IMAGE_ID" \
            --display-name "micro-runner-vm" \
            --assign-public-ip true \
            --ssh-authorized-keys-file ssh_key.pub)

          INSTANCE_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Send Success Telegram Notification
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ *AMD Micro VM Başarıyla Açıldı!*%0A%0A🚀 Şimdi SSH ile bağlanıp seri arama scriptini başlatabiliriz." \
            -d "parse_mode=Markdown"
