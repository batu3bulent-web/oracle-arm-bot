name: Oracle VM Auto Retry

on:
  workflow_dispatch: # Manuel çalıştırmak için (Run workflow butonu)
  repository_dispatch: # Dış cron servislerinden (cron-job.org vb.) istek gelince çalışması için
    types: [trigger-retry]
  schedule:
    - cron: '*/5 * * * *' # GitHub'ın kendi zamanlayıcısı (yedek olarak dursun)

jobs:
  launch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ad:
          - "LHiX:EU-FRANKFURT-1-AD-1"
          - "LHiX:EU-FRANKFURT-1-AD-2"
          - "LHiX:EU-FRANKFURT-1-AD-3"
    steps:
      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Setup OCI Config
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=/home/runner/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=eu-frankfurt-1" >> ~/.oci/config
          
          # Key dosyasını güvenli şekilde yaz ve izinleri ayarla
          printf "%s\n" "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config

      - name: Launch VM
        continue-on-error: true
        shell: bash
        env:
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          oci compute instance launch \
            --availability-domain "${{ matrix.ad }}" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --shape VM.Standard.A1.Flex \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --display-name minecraft-server \
            --assign-public-ip true \
            --ssh-authorized-keys-file <(echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}")
