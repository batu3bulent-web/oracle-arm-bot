name: Oracle VM Auto Retry

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-retry]
  schedule:
    - cron: '*/5 * * * *' # 5 dakikada bir sunucu alma denemesi
    - cron: '0 19 * * *'  # Her gün TSI 22:00'da (UTC 19:00) günlük rapor

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. OCI CLI'ı sorunsuz kuran Python/pip adımı
      - name: Install OCI CLI
        run: |
          python3 -m pip install --upgrade pip
          pip install oci-cli

      # 2. OCI Kimlik Bilgilerini ve Pem Anahtarını Hazırlama
      - name: Setup OCI Config
        run: |
          mkdir -p ~/.oci
          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_KEY_FILE }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF
          chmod 600 ~/.oci/config

      # 3. Günlük Rapor (Saat 22:00 tetiklemesiyse çalışır)
      - name: Send Daily Report
        if: github.event.schedule == '0 19 * * *'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=📊 *Günlük Oracle Raporu*%0A%0ASistem aktif olarak Frankfurt sunucu kapasitesini zorlamaya devam ediyor." \
            -d "parse_mode=Markdown"

      # 4. ARM Sunucu Açma Denemesi (Rapor saati değilse çalışır)
      - name: Launch Oracle ARM Instance
        if: github.event.schedule != '0 19 * * *'
        id: launch_vm
        continue-on-error: true
        env:
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > ssh_key.pub

          oci compute instance launch \
            --availability-domain "LHiX:EU-FRANKFURT-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id "${{ secrets.OCI_SUBNET_OCID }}" \
            --image-id "ocid1.image.oc1.eu-frankfurt-1.aaaaaaaakxfyq4y..." \
            --display-name "arm-server" \
            --assign-public-ip true \
            --ssh-authorized-keys-file ssh_key.pub

      # 5. Başarılı Olursa Telegram Bildirimi
      - name: Send Success Telegram Notification
        if: steps.launch_vm.outcome == 'success' && github.event.schedule != '0 19 * * *'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🎉 *Oracle Sunucusu Başarıyla Kuruldu!*%0A%0A4 OCPU / 24GB RAM ARM sunucun başarıyla açıldı." \
            -d "parse_mode=Markdown"
