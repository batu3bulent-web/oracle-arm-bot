name: Launch Micro AMD Instance (Debug & Launch)

on:
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          python3 -m pip install --upgrade pip setuptools
          pip install oci-cli

      - name: Setup OCI Config
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          python3 -c "import os; open('/home/runner/.oci/oci_api_key.pem', 'w').write(os.environ['OCI_KEY_CONTENT'].strip() + '\n')"
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF
          chmod 600 ~/.oci/config

      - name: Validate Resources & Launch
        id: launch_vm
        env:
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SSH_KEY_CONTENT: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          python3 -c "import os; open('ssh_key.pub', 'w').write(os.environ['SSH_KEY_CONTENT'].strip() + '\n')"

          # 1. Subnet Kontrolü
          echo "Checking Subnet..."
          oci network subnet get --subnet-id "${{ secrets.OCI_SUBNET_ID }}" > /dev/null || { echo "❌ OCI_SUBNET_ID geçersiz veya bulunamadı!"; exit 1; }

          # 2. Availability Domain Al
          AD_NAME=$(oci iam availability-domain list --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" --query "data[0].name" --raw-output)
          echo "Kullanılacak AD: $AD_NAME"

          # 3. Canonical Ubuntu 22.04 AMD İmajı Sorgula
          AMD_IMAGE_ID=$(oci compute image list \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "22.04" \
            --shape "VM.Standard.E2.1.Micro" \
            --query "data[0].id" \
            --raw-output)

          if [ -z "$AMD_IMAGE_ID" ] || [ "$AMD_IMAGE_ID" == "null" ]; then
            AMD_IMAGE_ID="${{ secrets.OCI_IMAGE_ID }}"
          fi
          echo "Kullanılacak İmaj ID: $AMD_IMAGE_ID"

          # 4. Sunucu Başlatma (Compartment olarak OCI_COMPARTMENT_OCID kullanılır)
          oci compute instance launch \
            --availability-domain "$AD_NAME" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --shape "VM.Standard.E2.1.Micro" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --image-id "$AMD_IMAGE_ID" \
            --display-name "micro-runner-vm" \
            --assign-public-ip true \
            --ssh-authorized-keys-file ssh_key.pub

      - name: Send Success Telegram Notification
        if: steps.launch_vm.outcome == 'success'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🚀 *AMD Micro Sunucun Başarıyla Kuruldu!*" \
            -d "parse_mode=Markdown"
